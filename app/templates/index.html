<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Questions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for icons and hover effects */
        .upload-icon {
            width: 3rem;
            height: 3rem;
        }
        .file-icon {
            width: 3rem;
            height: 3rem;
        }
    </style>
</head>
<body class="min-h-screen bg-[#f5f7fa]">
    <!-- Title Section -->
    <div class="w-full bg-[#3FA9F5] py-5 px-6">
        <h1 class="text-white font-bold text-2xl">Create Questions</h1>
    </div>

    <!-- Main Layout -->
    <div class="max-w-7xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-lg p-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                <!-- Left Column - Sources -->
                <div class="flex flex-col">
                    <h2 class="text-lg font-medium text-gray-800 mb-4">Sources</h2>
                    <div class="flex-1 bg-[#e9edf5] rounded-xl p-6">
                        <form id="uploadForm" enctype="multipart/form-data">
                            <input type="file" id="fileInput" name="file" multiple class="hidden" accept=".pptx,.ppt">
                            <div
                                id="uploadArea"
                                onclick="document.getElementById('fileInput').click()"
                                class="h-[350px] border-2 border-dashed border-gray-400 rounded-xl bg-white flex flex-col items-center justify-center cursor-pointer hover:border-[#3FA9F5] transition-colors"
                            >
                                <!-- Upload Icon SVG -->
                                <svg class="upload-icon text-gray-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                                </svg>
                                <p class="font-bold text-gray-700 text-lg mb-2">Upload Sources</p>
                                <p class="text-gray-500 text-sm">Click to browse files</p>
                            </div>
                        </form>
                        <div id="fileList" class="mt-4 hidden">
                            <p class="text-sm font-medium text-gray-700 mb-2">Selected files:</p>
                            <ul id="fileListItems" class="text-sm text-gray-600"></ul>
                        </div>
                    </div>
                </div>

                <!-- Right Column - JSON Output -->
                <div class="flex flex-col">
                    <h2 class="text-lg font-medium text-gray-800 mb-4">JSON Output</h2>
                    <div class="flex-1 bg-[#e9edf5] rounded-xl p-6">
                        <div id="outputPlaceholder" class="h-[350px] border-2 border-dashed border-gray-300 rounded-xl bg-white flex flex-col items-center justify-center text-gray-400">
                            <!-- Document Icon SVG -->
                            <svg class="file-icon mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                            <p class="font-medium text-base mb-2">No output yet</p>
                            <p class="text-sm">LLM responses will appear here</p>
                        </div>
                        <div id="outputContent" class="h-[350px] border-2 border-gray-300 rounded-xl bg-white p-4 overflow-auto hidden">
                            <pre id="jsonOutput" class="text-sm text-gray-700 whitespace-pre-wrap"></pre>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bottom Button -->
            <div class="flex justify-center mt-8">
                <button
                    id="generateBtn"
                    onclick="generateQuestions()"
                    class="bg-[#3FA9F5] text-white font-semibold px-8 py-3 rounded-full hover:bg-[#2d8dd4] transition-colors shadow-md"
                >
                    Generate Questions
                </button>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const fileListItems = document.getElementById('fileListItems');
        const uploadForm = document.getElementById('uploadForm');
        const outputPlaceholder = document.getElementById('outputPlaceholder');
        const outputContent = document.getElementById('outputContent');
        const jsonOutput = document.getElementById('jsonOutput');
        const generateBtn = document.getElementById('generateBtn');

        fileInput.addEventListener('change', async function(e) {
            const files = e.target.files;
            if (files && files.length > 0) {
                // Show file list
                fileListItems.innerHTML = '';
                Array.from(files).forEach(file => {
                    const li = document.createElement('li');
                    li.textContent = `• ${file.name}`;
                    fileListItems.appendChild(li);
                });
                fileList.classList.remove('hidden');

                // Upload files
                const formData = new FormData();
                Array.from(files).forEach(file => {
                    formData.append('file', file);
                });

                try {
                    const response = await fetch('/upload', {
                        method: 'POST',
                        body: formData
                    });

                    if (response.ok) {
                        const data = await response.json();
                        console.log('Files uploaded:', data);
                    } else {
                        console.error('Upload failed');
                    }
                } catch (error) {
                    console.error('Error uploading files:', error);
                }
            }
        });

        async function generateQuestions() {
            console.log('Generate Questions button clicked');
            generateBtn.disabled = true;
            generateBtn.textContent = 'Generating...';
            generateBtn.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    console.log('Generation started:', data);
                    
                    // Show placeholder output (replace with actual JSON when ready)
                    outputPlaceholder.classList.add('hidden');
                    outputContent.classList.remove('hidden');
                    jsonOutput.textContent = JSON.stringify({
                        message: 'Question generation in progress...',
                        status: 'processing'
                    }, null, 2);
                } else {
                    console.error('Generation failed');
                }
            } catch (error) {
                console.error('Error generating questions:', error);
            } finally {
                generateBtn.disabled = false;
                generateBtn.textContent = 'Generate Questions';
                generateBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
